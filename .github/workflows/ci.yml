name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Checks don't need the Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npx biome ci src scripts electron
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx next build
